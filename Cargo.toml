[package]
name = "epicbox-store"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/blacktyger/epicbox-store"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ic-cdk = "0.20"
candid = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256", "alloc"] }
sha2 = { version = "0.10", default-features = false }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
